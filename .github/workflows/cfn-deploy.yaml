name: Deploy Stack

on:
  workflow_call:
    inputs:
      # GitHub Environment (ci, devl, test, prod)
      environment:
        description: "GitHub environment name for accessing environment-scoped variables. Must be one of: ci, devl, test, prod."
        required: false
        type: string
        default: "ci"

      # Concurrency group name (optional - allows caller to customize)
      concurrency-group:
        description: "Concurrency group name for workflow runs"
        required: false
        type: string
        default: ""

       # Stack Configuration
      stack-name:
        description: "CloudFormation stack name"
        required: false
        type: string
        default: ""

      # Parameters Configuration
      parameters-file:
        description: "Path to CloudFormation parameters file"
        required: false
        type: string
        default: "infra/parameters.json"

      template-file:
        description: "Path to CloudFormation template file"
        required: false
        type: string
        default: "infra/template.yaml"

      skip-template-validation:
        description: "Skip CloudFormation template validation for faster development iterations"
        required: false
        type: boolean
        default: false

      skip-s3-upload:
        description: "Skip S3 template upload and use last uploaded template from S3 bucket"
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  actions: write

concurrency:
  group: ${{ inputs.concurrency-group || format('cfn-deploy-{0}-{1}', inputs.environment, github.ref) }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate CloudFormation Template
    runs-on: ubuntu-26.04
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
      actions: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_OIDC_ROLE_NAME: ${{ vars.AWS_OIDC_ROLE_NAME }}
    outputs:
      ci-suffix: ${{ steps.ci-suffix.outputs.suffix }}
      stack-name: ${{ steps.prepare-stack-name.outputs.stack-name }}
      parameters-file-path: ${{ steps.params-path.outputs.path }}
    steps:
      - name: Validate Environment
        id: validate-env
        shell: bash
        run: |
          # Validate environment input
          if [[ "${{ inputs.environment }}" != "ci" && "${{ inputs.environment }}" != "devl" && "${{ inputs.environment }}" != "test" && "${{ inputs.environment }}" != "prod" ]]; then
            echo "Error: Invalid environment '${{ inputs.environment }}'. Must be one of: ci, devl, test, prod"
            exit 1
          fi
          echo "✅ Valid environment: ${{ inputs.environment }}"

      - name: Print Inputs and Configuration to Summary
        if: vars.PRINT_DEBUG_INFO == 'true'
        env:
          CFN_TEMPLATE_S3_BUCKET_NAME: ${{ vars.CFN_TEMPLATE_S3_BUCKET_NAME }}
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## 🔍 CloudFormation Deploy - Debug Info (`cfn-deploy-wf`)

          ### Workflow Inputs
          | Parameter | Value |
          |-----------|-------|
          | Environment | `${{ inputs.environment }}` |
          | AWS Region | `${{ env.AWS_REGION }}` |
          | AWS Account ID | `${{ env.AWS_ACCOUNT_ID }}` |
          | OIDC Role Name | `${{ env.AWS_OIDC_ROLE_NAME }}` |
          | S3 Bucket | `${{ env.CFN_TEMPLATE_S3_BUCKET_NAME }}` |
          | Stack Name (Base) | `${{ inputs.stack-name }}` |
          | Template File | `${{ inputs.template-file }}` |
          | Parameters File | `${{ inputs.parameters-file }}` |
          | Concurrency Group | `${{ inputs.concurrency-group }}` |
          | Skip Template Validation | `${{ inputs.skip-template-validation }}` |
          | Skip S3 Upload | `${{ inputs.skip-s3-upload }}` |
          EOF

      - name: Check if Artifact Exists
        id: check-artifact
        shell: bash
        run: |
          ARTIFACT_NAME="cfn-deploy-params"

          # Check if artifact exists using GitHub API
          ARTIFACT_ID=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts \
            --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\") | .id" 2>/dev/null)

          if [[ -n "$ARTIFACT_ID" ]]; then
            echo "artifact-exists=true" >> $GITHUB_OUTPUT
            echo "✅ Artifact exists: $ARTIFACT_NAME (ID: $ARTIFACT_ID)"
          else
            echo "artifact-exists=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Artifact does not exist: $ARTIFACT_NAME"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download Previous Artifacts
        id: download-artifact
        if: steps.check-artifact.outputs.artifact-exists == 'true'
        uses: actions/download-artifact@v4
        with:
          name: cfn-deploy-params
          path: .artifacts

      - name: Extract Parameters File Path
        id: params-path
        shell: bash
        run: |
          PARAMS_FILE="${{ inputs.parameters-file }}"
          PARAMS_PATH=$(dirname "$PARAMS_FILE")
          echo "path=${PARAMS_PATH}" >> $GITHUB_OUTPUT
          echo "✅ Parameters file path: ${PARAMS_PATH}"

      - name: Check Artifact Download
        shell: bash
        run: |
          PARAMS_PATH="${{ steps.params-path.outputs.path }}"
          if [[ "${{ steps.check-artifact.outputs.artifact-exists }}" == "false" ]]; then
            echo "ℹ️  Artifact does not exist - skipping download (expected on first run)"
          elif [[ "${{ steps.download-artifact.outcome }}" == "success" && -f ".artifacts/${PARAMS_PATH}/parameters-updated.json" ]]; then
            echo "✅ Successfully downloaded previous artifact"
          else
            echo "⚠️  Artifact exists but download failed"
          fi

      - name: Generate CI Suffix
        id: ci-suffix
        shell: bash
        run: |
          if [[ "${{ inputs.environment }}" == "ci" ]]; then
            # Try to read existing CI_SUFFIX from artifact
            if [[ -f ".artifacts/cfn-params.json" ]]; then
              CI_SUFFIX=$(jq -r '.CiSuffix // empty' .artifacts/cfn-params.json 2>/dev/null | tr '[:upper:]' '[:lower:]')
              if [[ -n "$CI_SUFFIX" ]]; then
                echo "suffix=${CI_SUFFIX}" >> $GITHUB_OUTPUT
                echo "✅ Reused existing CI suffix from artifact: ${CI_SUFFIX}"
              else
                CI_SUFFIX=$(openssl rand -hex 2 | tr -d '\n' | tr '[:upper:]' '[:lower:]')
                echo "suffix=${CI_SUFFIX}" >> $GITHUB_OUTPUT
                echo "✅ Generated new CI suffix: ${CI_SUFFIX}"
              fi
            else
              CI_SUFFIX=$(openssl rand -hex 2 | tr -d '\n' | tr '[:upper:]' '[:lower:]')
              echo "suffix=${CI_SUFFIX}" >> $GITHUB_OUTPUT
              echo "✅ Generated new CI suffix: ${CI_SUFFIX}"
            fi
          else
            echo "suffix=" >> $GITHUB_OUTPUT
            echo "ℹ️  Skipping CI suffix generation (environment: ${{ inputs.environment }})"
          fi

      - name: Prepare Stack Name
        id: prepare-stack-name
        shell: bash
        run: |
          STACK_NAME="${{ inputs.stack-name }}"
          if [[ -z "$STACK_NAME" ]]; then
            STACK_NAME="${{ github.event.repository.name }}"
          fi

          echo "stack-name=${STACK_NAME}" >> $GITHUB_OUTPUT
          echo "✅ Final stack name: ${STACK_NAME}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.AWS_OIDC_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Credentials
        run: |
          echo "✅ Successfully configured AWS credentials"
          aws sts get-caller-identity

      - name: Extract Template Directory and Filename
        id: template-paths
        shell: bash
        run: |
          TEMPLATE_FILE="${{ inputs.template-file }}"
          TEMPLATE_DIR=$(dirname "$TEMPLATE_FILE")
          TEMPLATE_FILENAME=$(basename "$TEMPLATE_FILE")
          echo "directory=$TEMPLATE_DIR" >> $GITHUB_OUTPUT
          echo "filename=$TEMPLATE_FILENAME" >> $GITHUB_OUTPUT

      - name: Validate CloudFormation Templates
        if: ${{ !inputs.skip-template-validation }}
        uses: subhamay-bhattacharyya-gha/cfn-validate-action@main
        with:
          aws-role-arn: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.AWS_OIDC_ROLE_NAME }}
          cloudformation-dir: ${{ steps.template-paths.outputs.directory }}
          template-file: ${{ steps.template-paths.outputs.filename }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run CloudFormation Lint
        if: ${{ !inputs.skip-template-validation }}
        uses: subhamay-bhattacharyya-gha/cfn-lint-action@v1.0.0
        with:
          template-path: ${{ inputs.template-file }}

      - name: Skip Template Validation
        if: ${{ inputs.skip-template-validation }}
        run: |
          echo "⏭️  Skipping template validation"

      - name: Validate Parameters Against Template
        shell: bash
        run: |
          set -e
          PARAMS_FILE="${{ inputs.parameters-file }}"
          TEMPLATE_FILE="${{ inputs.template-file }}"
          ERRORS=0

          echo "🔍 Pre-flight check: Validating parameters against template..."
          echo ""

          # Check if parameters file exists
          if [[ ! -f "$PARAMS_FILE" ]]; then
            echo "⚠️  Parameters file not found: $PARAMS_FILE. Skipping parameter validation."
            exit 0
          fi

          # Validate JSON is parseable
          if ! cat "$PARAMS_FILE" | jq empty 2>/dev/null; then
            echo "❌ Error: Invalid JSON in parameters file"
            exit 1
          fi

          # Check if template file exists
          if [[ ! -f "$TEMPLATE_FILE" ]]; then
            echo "⚠️  Template file not found: $TEMPLATE_FILE. Skipping parameter validation."
            exit 0
          fi

          # Get template parameters using CloudFormation validation
          echo "📋 Extracting template parameters from template..."
          template_info=$(aws cloudformation validate-template --template-body file://"$TEMPLATE_FILE" \
            --region "${{ env.AWS_REGION }}" 2>/dev/null || echo "{}")

          declared=$(echo "$template_info" | jq -r '.Parameters[].ParameterKey' 2>/dev/null | sort || echo "")

          # Get passed parameters from parameters file
          echo "📋 Extracting passed parameters from file..."
          PARAMS=$(cat "$PARAMS_FILE")

          # Handle both object and array formats
          PARAMS_TYPE=$(echo "$PARAMS" | jq -r 'type')
          if [[ "$PARAMS_TYPE" == "object" ]]; then
            passed=$(echo "$PARAMS" | jq -r 'keys[]' 2>/dev/null | sort || echo "")
          else
            passed=$(echo "$PARAMS" | jq -r '.[].ParameterKey' 2>/dev/null | sort || echo "")
          fi

          {
            echo "## 🔍 CloudFormation Parameter Validation"
            echo ""
            echo "### Declared Parameters in Template"
            echo "\`\`\`"
            if [[ -n "$declared" ]]; then
              echo "$declared"
            else
              echo "(none)"
            fi
            echo "\`\`\`"
            echo ""

            # Check for unknown parameters (passed but not declared)
            unknown=$(comm -23 <(echo "$passed") <(echo "$declared") 2>/dev/null || echo "")
            if [[ -n "$unknown" ]]; then
              echo "### ❌ Unknown Parameters"
              echo "The following parameters are not declared in the template:"
              echo "\`\`\`"
              echo "$unknown"
              echo "\`\`\`"
              echo ""
              ERRORS=$((ERRORS + 1))
            fi

            if [[ $ERRORS -eq 0 ]]; then
              echo "### ✅ Validation Passed"
              echo "All parameters are valid."
            else
              echo "### ❌ Validation Failed"
              echo "Please update your parameters file to match the template."
            fi
          } >> $GITHUB_STEP_SUMMARY

          # Also print to stdout for immediate feedback
          echo ""
          echo "📊 Parameter Validation Report:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Declared parameters in template:"
          if [[ -n "$declared" ]]; then
            echo "$declared" | sed 's/^/   /'
          else
            echo "   (none)"
          fi
          echo ""

          if [[ -n "$unknown" ]]; then
            echo "❌ ERROR: Unknown parameters not declared in template:"
            echo "$unknown" | sed 's/^/   /'
            echo ""
          fi

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [[ $ERRORS -eq 0 ]]; then
            echo "✅ All parameter validations passed"
            exit 0
          else
            echo "❌ Validation failed with $ERRORS error(s)"
            echo ""
            echo "::error::Parameter validation failed - see details in step summary"
            exit 1
          fi

  upload-to-s3:
    name: Upload Template to S3
    runs-on: ubuntu-26.04
    environment: ${{ inputs.environment }}
    needs: validate
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_OIDC_ROLE_NAME: ${{ vars.AWS_OIDC_ROLE_NAME }}
      CFN_TEMPLATE_S3_BUCKET_NAME: ${{ vars.CFN_TEMPLATE_S3_BUCKET_NAME }}
    outputs:
      template_url: ${{ steps.upload.outputs.template_url || steps.skip-upload.outputs.template_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        if: ${{ !inputs.skip-s3-upload }}
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.AWS_OIDC_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload template to S3 and set output
        id: upload
        if: ${{ !inputs.skip-s3-upload }}
        run: |
          TEMPLATE_FILENAME=$(basename "${{ inputs.template-file }}")
          TEMPLATE_KEY="${{ github.event.repository.name }}/${TEMPLATE_FILENAME}"
          echo "Uploading template to S3..."
          aws s3 cp ${{ inputs.template-file }} "s3://${{ env.CFN_TEMPLATE_S3_BUCKET_NAME }}/${TEMPLATE_KEY}" --region ${{ env.AWS_REGION }}

          TEMPLATE_URL="https://${{ env.CFN_TEMPLATE_S3_BUCKET_NAME }}.s3.${{ env.AWS_REGION }}.amazonaws.com/${TEMPLATE_KEY}"
          echo "template_url=${TEMPLATE_URL}" >> $GITHUB_OUTPUT
          echo "Template URL: ${TEMPLATE_URL}"
          echo "✅ Template uploaded to S3"

      - name: Skip S3 Upload - Use Existing Template
        id: skip-upload
        if: ${{ inputs.skip-s3-upload }}
        run: |
          TEMPLATE_FILENAME=$(basename "${{ inputs.template-file }}")
          TEMPLATE_KEY="${{ github.event.repository.name }}/${TEMPLATE_FILENAME}"
          TEMPLATE_URL="https://${{ env.CFN_TEMPLATE_S3_BUCKET_NAME }}.s3.${{ env.AWS_REGION }}.amazonaws.com/${TEMPLATE_KEY}"
          echo "template_url=${TEMPLATE_URL}" >> $GITHUB_OUTPUT
          echo "⏭️  Skipping S3 upload - using existing template from S3"
          echo "Template URL: ${TEMPLATE_URL}"

  deploy:
    name: Deploy Stack
    runs-on: ubuntu-26.04
    environment: ${{ inputs.environment }}
    needs:
      - validate
      - upload-to-s3
    permissions:
      id-token: write
      contents: read
      actions: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_OIDC_ROLE_NAME: ${{ vars.AWS_OIDC_ROLE_NAME }}
      CFN_TEMPLATE_S3_BUCKET_NAME: ${{ vars.CFN_TEMPLATE_S3_BUCKET_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.AWS_OIDC_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare CloudFormation Parameters with CiSuffix
        id: prepare-params
        shell: bash
        run: |
          set -e
          CI_SUFFIX="${{ needs.validate.outputs.ci-suffix }}"
          PARAMS_FILE="${{ inputs.parameters-file }}"
          PARAMS_PATH="${{ needs.validate.outputs.parameters-file-path }}"

          echo "📋 Preparing CloudFormation parameters..."

          if [[ -f "$PARAMS_FILE" ]]; then
            echo "Reading parameters from: $PARAMS_FILE"
            PARAMS=$(cat "$PARAMS_FILE")
          else
            echo "⚠️  Parameters file not found: $PARAMS_FILE. Using empty array."
            PARAMS="[]"
          fi

          # Validate JSON is parseable
          if ! echo "$PARAMS" | jq empty 2>/dev/null; then
            echo "❌ Error: Invalid JSON in parameters file"
            exit 1
          fi

          # Ensure parameters are in array format
          PARAMS_TYPE=$(echo "$PARAMS" | jq -r 'type')
          if [[ "$PARAMS_TYPE" != "array" ]]; then
            echo "⚠️  Parameters not in array format. Converting..."
            PARAMS=$(echo "$PARAMS" | jq '[to_entries[] | {ParameterKey: .key, ParameterValue: .value}]')
          fi

          # Add or update CiSuffix parameter if in CI environment
          if [[ -n "$CI_SUFFIX" ]]; then
            PARAMS=$(echo "$PARAMS" | jq \
              --arg key "CiSuffix" \
              --arg value "$CI_SUFFIX" \
              'map(select(.ParameterKey != $key)) + [{ParameterKey: $key, ParameterValue: $value}]')
            echo "✅ Added CiSuffix parameter: $CI_SUFFIX"
          else
            PARAMS=$(echo "$PARAMS" | jq \
              'map(select(.ParameterKey != "CiSuffix")) + [{ParameterKey: "CiSuffix", ParameterValue: ""}]')
            echo "✅ Set CiSuffix to empty string (not in CI environment)"
          fi

          echo "$PARAMS" | jq . > ${PARAMS_PATH}/parameters-updated.json
          echo "parameters_file=${PARAMS_PATH}/parameters-updated.json" >> $GITHUB_OUTPUT

      - name: Display Input Parameters Summary
        shell: bash
        run: |
          PARAMS_PATH="${{ needs.validate.outputs.parameters-file-path }}"
          PARAMS_FILE="${{ steps.prepare-params.outputs.parameters_file }}"
          {
            echo "## 🚀 CloudFormation Deployment Parameters"
            echo ""
            echo "### Workflow Inputs"
            echo "| Parameter | Value |"
            echo "|-----------|-------|"
            echo "| Environment | ${{ inputs.environment }} |"
            echo "| AWS Region | ${{ env.AWS_REGION }} |"
            echo "| AWS Account ID | ${{ env.AWS_ACCOUNT_ID }} |"
            echo "| OIDC Role Name | ${{ env.AWS_OIDC_ROLE_NAME }} |"
            echo "| CFN Templates S3 Bucket | ${{ env.CFN_TEMPLATE_S3_BUCKET_NAME }} |"
            echo "| Stack Name | ${{ inputs.stack-name != '' && inputs.stack-name || 'default (repository name)' }} |"
            echo "| Template File | ${{ inputs.template-file }} |"
            echo "| Parameters File | ${{ inputs.parameters-file }} |"
            # echo "| Concurrency Group | ${{ inputs.concurrency-group != '' && inputs.concurrency-group || 'default (auto-generated)' }} |"
            echo ""
            echo "### Computed Values"
            echo "| Parameter | Value |"
            echo "|-----------|-------|"
            echo "| CI Suffix | ${{ needs.validate.outputs.ci-suffix != '' && needs.validate.outputs.ci-suffix || 'N/A (not in CI)' }} |"
            echo "| Final Stack Name | ${{ needs.validate.outputs.stack-name }} |"
            echo "| Template URL | ${{ needs.upload-to-s3.outputs.template_url }} |"
            echo "| Parameters File | ${PARAMS_FILE} |"
            echo ""
            echo "### CloudFormation Parameters"
            cat "${PARAMS_FILE}" | jq -r '"| # | Parameter Name | Value |\n|---|---|---|" , (to_entries[] | "| \(.key) | \(.value.ParameterKey) | `\(.value.ParameterValue)` |")'
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload Parameters as Artifact (for failure recovery)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfn-deploy-params
          path: ${{ steps.prepare-params.outputs.parameters_file }}
          retention-days: 30

      - name: Delete Existing Stack in CI Environment
        if: inputs.environment == 'ci'
        shell: bash
        run: |
          STACK_NAME="${{ needs.validate.outputs.stack-name }}"
          REGION="${{ env.AWS_REGION }}"

          echo "🗑️  Checking if stack exists: $STACK_NAME"

          if aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$REGION" 2>/dev/null; then
            echo "🗑️  Stack exists. Deleting stack: $STACK_NAME"
            aws cloudformation delete-stack --stack-name "$STACK_NAME" --region "$REGION"

            echo "⏳ Waiting for stack deletion to complete..."
            aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME" --region "$REGION" || true
            echo "✅ Stack deletion complete"
          else
            echo "ℹ️  Stack does not exist: $STACK_NAME. Proceeding with creation..."
          fi

      - name: Check if Stack Updates are Needed
        id: check-updates
        shell: bash
        run: |
          STACK_NAME="${{ needs.validate.outputs.stack-name }}"
          REGION="${{ env.AWS_REGION }}"
          TEMPLATE_URL="${{ needs.upload-to-s3.outputs.template_url }}"
          PARAMS_FILE="${{ steps.prepare-params.outputs.parameters_file }}"

          echo "🔍 Checking if stack needs updates: $STACK_NAME"

          # Check if stack exists
          if ! aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$REGION" &>/dev/null; then
            echo "updates-needed=true" >> $GITHUB_OUTPUT
            echo "✅ Stack does not exist - will be created"
            exit 0
          fi

          # Display current parameters
          echo ""
          echo "📋 Current Stack Parameters:"
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$REGION" \
            --query 'Stacks[0].Parameters' \
            --output table 2>/dev/null || echo "No parameters found"

          echo ""
          echo "📋 New Parameters to be applied:"
          if [[ -f "$PARAMS_FILE" ]]; then
            cat "$PARAMS_FILE" | jq . 2>/dev/null || cat "$PARAMS_FILE"
          else
            echo "⚠️  Parameters file not found: $PARAMS_FILE"
          fi

          echo ""
          echo "ℹ️  Stack exists - checking for template changes..."
          echo "updates-needed=true" >> $GITHUB_OUTPUT
          echo "ℹ️  Proceeding with update attempt (AWS will validate if changes exist)"
        env:
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Validate Parameters Format
        shell: bash
        run: |
          PARAMS_FILE="${{ steps.prepare-params.outputs.parameters_file }}"

          echo "📄 Parameters file path: $PARAMS_FILE"
          echo "📄 Parameters file contents:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          cat "$PARAMS_FILE" | jq . 2>/dev/null || cat "$PARAMS_FILE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "ℹ️  Verify that your parameters are in the correct format"
          echo "ℹ️  Expected format for CloudFormation: {\"ParameterKey\": \"ParameterValue\"}"
          echo ""

      - name: Validate Parameters Against Template
        shell: bash
        run: |
          set -e
          PARAMS_FILE="${{ steps.prepare-params.outputs.parameters_file }}"
          TEMPLATE_URL="${{ needs.upload-to-s3.outputs.template_url }}"
          ERRORS=0

          echo "🔍 Pre-flight check: Validating parameters against template..."
          echo ""

          # Fetch template info
          echo "📋 Fetching template parameters..."
          template_info=$(aws cloudformation validate-template --template-url "$TEMPLATE_URL" \
            --region "${{ env.AWS_REGION }}")

          declared=$(echo "$template_info" | jq -r '.Parameters[].ParameterKey' | sort)
          required=$(echo "$template_info" | jq -r '.Parameters[] | select(.DefaultValue == null) | .ParameterKey' | sort)

          # Get passed parameters from parameters file
          echo "📋 Extracting passed parameters from file..."
          passed=$(jq -r '.[].ParameterKey' "$PARAMS_FILE" 2>/dev/null | sort)
          passed_values=$(jq -r '.[] | "\(.ParameterKey)=\(.ParameterValue)"' "$PARAMS_FILE" 2>/dev/null)

          echo ""
          echo "📊 Parameter Validation Report:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Declared parameters in template (Required marked with *):"
          echo "$template_info" | jq -r '.Parameters[] | (if .DefaultValue == null then "* " else "  " end) + .ParameterKey' | sed 's/^/   /'
          echo ""

          # Check for unknown parameters (passed but not declared)
          unknown=$(comm -23 <(echo "$passed") <(echo "$declared"))
          if [[ -n "$unknown" ]]; then
            echo "❌ ERROR: Unknown parameters not declared in template:"
            echo "$unknown" | sed 's/^/   /'
            echo ""
            ERRORS=$((ERRORS + 1))
          fi

          # Check for missing required parameters
          missing_required=$(comm -23 <(echo "$required") <(echo "$passed"))
          if [[ -n "$missing_required" ]]; then
            echo "❌ ERROR: Missing required parameters:"
            echo "$missing_required" | sed 's/^/   /'
            echo ""
            ERRORS=$((ERRORS + 1))
          fi

          # Check for empty parameter values
          empty_params=$(echo "$passed_values" | grep '=$' || true)
          if [[ -n "$empty_params" ]]; then
            echo "⚠️  WARNING: Parameters with empty values:"
            echo "$empty_params" | sed 's/^/   /'
            echo ""
          fi

          # Summary
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [[ $ERRORS -eq 0 ]]; then
            echo "✅ All validations passed"
            exit 0
          else
            echo "❌ Validation failed with $ERRORS error(s)"
            echo ""
            echo "::error::Parameter validation failed - see details above"
            exit 1
          fi

      - name: Deploy CloudFormation Stack
        id: deploy
        continue-on-error: true
        uses: subhamay-bhattacharyya-gha/cfn-deploy-action@feature/GHA-0017-upgrade-github-runner-to
        with:
          stack-name: ${{ needs.validate.outputs.stack-name }}
          aws-region: ${{ env.AWS_REGION }}
          template-url: ${{ needs.upload-to-s3.outputs.template_url }}
          parameters-file: ${{ steps.prepare-params.outputs.parameters_file }}
          aws-account-id: ${{ env.AWS_ACCOUNT_ID }}
          oidc-role-name: ${{ env.AWS_OIDC_ROLE_NAME }}

      - name: Handle Deployment Result
        shell: bash
        run: |
          DEPLOY_STATUS="${{ steps.deploy.outcome }}"
          STACK_NAME="${{ needs.validate.outputs.stack-name }}"
          REGION="${{ env.AWS_REGION }}"

          if [[ "$DEPLOY_STATUS" == "success" ]]; then
            echo "✅ CloudFormation stack deployed successfully: $STACK_NAME"
            exit 0
          else
            # Deployment failed - check if it's due to "No updates are to be performed"
            echo "⏳ Checking stack status after deployment attempt..."

            STACK_STATUS=$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$REGION" \
              --query 'Stacks[0].StackStatus' \
              --output text 2>/dev/null || echo "DOES_NOT_EXIST")

            if [[ "$STACK_STATUS" == "CREATE_COMPLETE" || "$STACK_STATUS" == "UPDATE_COMPLETE" ]]; then
              echo ""
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "✅ Stack is already up-to-date (no updates needed)"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "Stack Name: $STACK_NAME"
              echo "Stack Status: $STACK_STATUS"
              echo ""
              echo "ℹ️  This is expected when template and parameters haven't changed."
              echo "ℹ️  The stack is in the desired state."
              echo ""
              exit 0
            else
              echo "❌ Deployment failed"
              echo "Stack Status: $STACK_STATUS"
              exit 1
            fi
          fi
        env:
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Delete Artifact on Successful Deployment
        if: success()
        shell: bash
        run: |
          ARTIFACT_NAME="cfn-deploy-params"

          echo "🗑️  Attempting to delete artifact: $ARTIFACT_NAME"

          # Get artifact ID
          ARTIFACT_ID=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts \
            --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\") | .id" 2>/dev/null)

          if [[ -z "$ARTIFACT_ID" ]]; then
            echo "ℹ️  Artifact does not exist or already deleted: $ARTIFACT_NAME"
            exit 0
          fi

          # Try to delete with better error handling
          if gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID 2>/dev/null; then
            echo "✅ Successfully deleted artifact: $ARTIFACT_NAME (ID: $ARTIFACT_ID)"
          else
            # If 403 error, log it but don't fail
            echo "⚠️  Could not delete artifact (may lack permissions): $ARTIFACT_NAME"
            echo "ℹ️  This is expected if the workflow doesn't have 'actions: write' permission"
            exit 0
          fi
        env:
          GH_TOKEN: ${{ github.token }}